<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wick</title>
  <meta name="description" content="A turn-based roguelike where your lantern's oil is your field of view. Moths chase the light, shades flee it, hounds hunt by sound.">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    noscript { position: fixed; inset: 0; display: grid; place-items: center; font: 16px Georgia, serif; color: #e8dcc4; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Wick: game canvas. Press any key to begin."></canvas>
  <noscript>Wick needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
